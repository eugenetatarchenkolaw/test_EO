name: Reference materials checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check documentation and empty forms
        run: python -m tools.check_repository
      - name: Rebuild cited figures
        run: python -m tools.generate_figures
      - name: Execute introductory metadata notebook
        run: |
          python - <<'PYTHON'
          import nbformat
          from nbclient import NotebookClient
          nb = nbformat.read('notebooks/00_start_here.ipynb', as_version=4)
          NotebookClient(nb, timeout=120, kernel_name='python3', resources={'metadata': {'path': '.'}}).execute()
          print('Introductory notebook executed; no participant results evaluated')
          PYTHON
